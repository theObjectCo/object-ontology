name: ci
on:
  push:
    branches: ["main"]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
      - run: npm ci
      - run: node tools/check-object-kit.mjs
      - run: node --test test/cloud-*.test.mjs
      - run: npm run typecheck
      - run: npm test
      - run: node test/webapp-browser.mjs
      - run: node test/makigami-browser.mjs
      - run: node test/editor-browser.mjs
      - run: node tools/check-examples.mjs

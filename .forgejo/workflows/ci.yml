name: ci
on:
  push:
    branches: ["main"]
  pull_request:

jobs:
  verify:
    runs-on: docker
    container:
      image: node:22-bookworm
    steps:
      - name: Checkout
        run: |
          git init -q .
          git -c http.extraHeader="Authorization: token ${{ github.token }}" fetch -q --depth 1 "${{ github.server_url }}/${{ github.repository }}.git" "${{ github.sha }}"
          git checkout -q FETCH_HEAD
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: node tools/check-examples.mjs

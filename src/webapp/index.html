<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>OPM / Makigami Studio — Phenome Object Ontology</title>
<link rel="stylesheet" href="./webview.css">
<style>
  :root {
    --neutral-50: #f0f0f0;
    --neutral-100: #e5e5e5;
    --neutral-200: #d2d2d2;
    --neutral-300: #bfbfbf;
    --neutral-400: #adadad;
    --neutral-500: #999999;
    --neutral-600: #818181;
    --neutral-700: #666666;
    --neutral-800: #505050;
    --neutral-900: #383838;
    --neutral-950: #282828;
    --neutral-975: #1e1e1e;

    --petrol-50: #eff9fc;
    --petrol-100: #d4f1fa;
    --petrol-200: #a7e2f6;
    --petrol-300: #75d4f0;
    --petrol-400: #43c2e5;
    --petrol-500: #04b0d5;
    --petrol-600: #0092b1;
    --petrol-700: #017892;
    --petrol-800: #12657a;
    --petrol-900: #013f4e;
    --petrol-950: #022c37;

    --header-height: 40px;
    --rail-width: 44px;
  }

  body.vscode-dark {
    color-scheme: dark;
    --paper: var(--neutral-975);
    --paper-card: var(--neutral-950);
    --paper-card-hover: var(--neutral-900);
    --paper-line: var(--neutral-800);
    --paper-line-focus: var(--petrol-400);
    --text-dark: var(--neutral-50);
    --paper-text-muted: var(--neutral-400);
    --paper-fill-hover: var(--neutral-950);
    --paper-fill-selected: var(--neutral-900);
    --paper-disabled-ink: var(--neutral-400);
    --paper-cue: var(--petrol-400);
    --paper-teal: var(--petrol-400);
    --paper-primary-tint: var(--petrol-900);
    --paper-primary-tint-hover: var(--petrol-950);

    --vscode-font-family: "IBM Plex Sans", "Segoe UI", system-ui, -apple-system, sans-serif;
    --vscode-font-size: 13px;
    --vscode-editor-font-family: "IBM Plex Mono", Consolas, "JetBrains Mono", "Courier New", monospace;
    --vscode-foreground: var(--neutral-50);
    --vscode-descriptionForeground: var(--neutral-400);
    --vscode-errorForeground: #f85149;
    --vscode-focusBorder: var(--petrol-400);
    --vscode-editor-background: var(--neutral-975);
    --vscode-editor-foreground: var(--neutral-50);
    --vscode-editorLineNumber-foreground: var(--neutral-600);
    --vscode-editor-selectionBackground: var(--petrol-900);
    --vscode-editorError-foreground: #f85149;
    --vscode-editorWarning-foreground: #cca700;
    --vscode-editorInfo-foreground: var(--petrol-400);
    --vscode-editorWidget-background: var(--neutral-950);
    --vscode-editorWidget-border: var(--neutral-800);
    --vscode-widget-shadow: rgba(0, 0, 0, 0.36);
    --vscode-input-background: var(--neutral-950);
    --vscode-input-foreground: var(--neutral-50);
    --vscode-input-border: var(--neutral-800);
    --vscode-inputValidation-errorBackground: #5a1d1d;
    --vscode-inputValidation-errorBorder: #be1100;
    --vscode-inputValidation-warningBackground: #352a05;
    --vscode-inputValidation-warningBorder: #b89500;
    --vscode-button-background: var(--petrol-700);
    --vscode-button-foreground: #ffffff;
    --vscode-button-hoverBackground: var(--petrol-600);
    --vscode-button-secondaryBackground: var(--neutral-950);
    --vscode-button-secondaryForeground: var(--neutral-50);
    --vscode-button-secondaryHoverBackground: var(--neutral-900);
    --vscode-textLink-foreground: var(--petrol-400);
    --vscode-toolbar-hoverBackground: var(--neutral-900);
    --vscode-list-hoverBackground: var(--neutral-950);
    --vscode-list-activeSelectionBackground: var(--petrol-900);
    --vscode-list-activeSelectionForeground: var(--neutral-50);
    --vscode-menu-background: var(--neutral-950);
    --vscode-menu-foreground: var(--neutral-50);
    --vscode-menu-selectionBackground: var(--petrol-900);
    --vscode-menu-selectionForeground: var(--petrol-300);
    --vscode-panel-border: var(--neutral-800);
  }

  body.vscode-light {
    color-scheme: light;
    --paper: var(--neutral-50);
    --paper-card: var(--neutral-100);
    --paper-card-hover: var(--neutral-200);
    --paper-line: var(--neutral-300);
    --paper-line-focus: var(--petrol-700);
    --text-dark: var(--neutral-975);
    --paper-text-muted: var(--neutral-800);
    --paper-fill-hover: var(--neutral-100);
    --paper-fill-selected: var(--neutral-200);
    --paper-disabled-ink: var(--neutral-600);
    --paper-cue: var(--petrol-700);
    --paper-teal: var(--petrol-700);
    --paper-primary-tint: var(--petrol-100);
    --paper-primary-tint-hover: var(--petrol-50);

    --vscode-font-family: "IBM Plex Sans", "Segoe UI", system-ui, -apple-system, sans-serif;
    --vscode-editor-font-family: "IBM Plex Mono", Consolas, "JetBrains Mono", "Courier New", monospace;
    --vscode-foreground: var(--neutral-975);
    --vscode-descriptionForeground: var(--neutral-800);
    --vscode-errorForeground: #c94a29;
    --vscode-focusBorder: var(--petrol-700);
    --vscode-editor-background: var(--neutral-50);
    --vscode-editor-foreground: var(--neutral-975);
    --vscode-editorLineNumber-foreground: var(--neutral-600);
    --vscode-editor-selectionBackground: var(--petrol-100);
    --vscode-editorError-foreground: #e51400;
    --vscode-editorWarning-foreground: #bf8803;
    --vscode-editorWidget-background: var(--neutral-100);
    --vscode-editorWidget-border: var(--neutral-300);
    --vscode-widget-shadow: rgba(0, 0, 0, 0.16);
    --vscode-input-background: #ffffff;
    --vscode-input-foreground: var(--neutral-975);
    --vscode-input-border: var(--neutral-300);
    --vscode-inputValidation-errorBackground: #f2dede;
    --vscode-inputValidation-errorBorder: #be1100;
    --vscode-button-background: var(--petrol-700);
    --vscode-button-foreground: #ffffff;
    --vscode-button-hoverBackground: var(--petrol-800);
    --vscode-button-secondaryBackground: var(--neutral-100);
    --vscode-button-secondaryForeground: var(--neutral-975);
    --vscode-button-secondaryHoverBackground: var(--neutral-200);
    --vscode-textLink-foreground: var(--petrol-700);
    --vscode-toolbar-hoverBackground: var(--neutral-200);
    --vscode-list-hoverBackground: var(--neutral-100);
    --vscode-list-activeSelectionBackground: var(--petrol-100);
    --vscode-list-activeSelectionForeground: var(--neutral-975);
    --vscode-menu-background: var(--neutral-100);
    --vscode-menu-foreground: var(--neutral-975);
    --vscode-menu-selectionBackground: var(--petrol-100);
    --vscode-menu-selectionForeground: var(--petrol-800);
    --vscode-panel-border: var(--neutral-300);
  }

  #opm-webapp-shell {
    display: flex;
    flex-direction: column;
    height: 100vh;
    width: 100vw;
    overflow: hidden;
    background: var(--paper);
    color: var(--text-dark);
  }

  #opm-webapp-toast {
    position: fixed;
    bottom: 42px;
    right: 18px;
    padding: 7px 14px;
    border-radius: 0;
    background: var(--vscode-button-background);
    color: var(--vscode-button-foreground);
    font-size: 12px;
    box-shadow: 0 4px 14px var(--vscode-widget-shadow);
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.18s ease;
    z-index: 100;
  }
  #opm-webapp-toast.visible {
    opacity: 1;
  }
</style>
<link rel="stylesheet" href="./webapp.css">
</head>
<body class="vscode-dark">
  <div id="opm-webapp-shell" class="v2-studio-app">
    <div id="opm-webapp-bar"></div>
    <div id="opm-webapp-workspace" class="v2-workspace">
      <div id="opm-webapp-rail-mount"></div>
      <div id="opm-webapp-stage" class="opm-stage split-horizontal">
        <div id="opm-webapp-json-mount"></div>
        <div id="root" data-elk-worker="./elk-worker.min.js"></div>
      </div>
      <div id="opm-webapp-panel-root" class="opm-app"></div>
    </div>
  </div>
  <script src="./webapp.js"></script>
  <script src="./webview.js"></script>
</body>
</html>
